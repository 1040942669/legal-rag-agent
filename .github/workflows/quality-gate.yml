name: Milestone Quality Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: milestone-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: offline / Python 3.12.13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALLOW_LIVE_MODEL_CALLS: "false"
      DO_NOT_TRACK: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      LEGAL_RAG_DISABLE_DOTENV: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out the pull request head commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out the pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.10"
          enable-cache: false

      - name: Verify the lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify the environment in uv offline mode
        run: uv sync --check --offline --frozen

      - name: Run the M2 cumulative offline quality gate
        run: >-
          uv run --offline --frozen --no-sync python scripts/quality_gate.py
          --milestone M2
          --mode offline
          --output "${RUNNER_TEMP}/m2-quality-gate.json"

      - name: Upload the machine-readable gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-quality-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-quality-gate.json
          if-no-files-found: error
          retention-days: 14
