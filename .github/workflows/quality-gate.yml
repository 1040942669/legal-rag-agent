name: M0 Quality Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: m0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline / Python 3.12.13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALLOW_LIVE_MODEL_CALLS: "false"
      DO_NOT_TRACK: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.10"
          enable-cache: false

      - name: Verify the lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify the environment in uv offline mode
        run: uv sync --check --offline --frozen

      - name: Run the M0 offline quality gate
        run: >-
          uv run --offline --frozen --no-sync python scripts/quality_gate.py
          --milestone M0
          --mode offline
          --output "${RUNNER_TEMP}/m0-quality-gate.json"
