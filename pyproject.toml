[project]
name = "legal-rag-assistant"
version = "0.3.0"
description = "A reproducible RAG assistant for versioned Chinese law text snapshots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.12.0",
    "llama-index-llms-ollama>=0.5.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "llama-index-retrievers-bm25>=0.5.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[project.optional-dependencies]
database = [
    "alembic>=1.15,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tmp/pytest-cache"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["legal_rag*"]
exclude = ["configs*", "reports*", "artifacts*", "eval_cases*", "tests*"]

[tool.setuptools.package-data]
"legal_rag.storage.alembic" = ["script.py.mako"]
