data:
  dataset_dir: Chinese-Laws/Chinese-Laws
  readme_path: Chinese-Laws/README.md
  # 已被民法典(2021-01-01 施行)废止但仍保留在数据集中的法律，检索时默认降权。
  deprecated_laws:
    - 中华人民共和国民法通则
    - 中华人民共和国合同法
    - 中华人民共和国继承法

artifacts:
  profile_dir: artifacts/profile
  index_dir: artifacts/indexes
  report_dir: reports

models:
  ollama:
    - qwen2.5:7b
    - qwen3.5:4b
    - gemma4:e2b
  default: qwen2.5:7b

embedding:
  default: bge_large_zh
  cache_dir: artifacts/embeddings
  batch_size: 16
  device: auto
  model_name: BAAI/bge-large-zh-v1.5
  models:
    bge_large_zh:
      provider: sentence_transformers
      model_name: BAAI/bge-large-zh-v1.5
      role: chinese_general_baseline
      normalize: true
      trust_remote_code: false
      query_prefix: ""
      document_prefix: ""
    bge_large_zh_meta:
      provider: sentence_transformers
      model_name: BAAI/bge-large-zh-v1.5
      role: metadata_embedding_ablation
      normalize: true
      trust_remote_code: false
      query_prefix: "为这个句子生成表示以用于检索相关文章："
      document_prefix: ""
      embed_with_metadata: true
    qwen3_embedding_4b_meta:
      provider: siliconflow
      model_name: Qwen/Qwen3-Embedding-4B
      role: metadata_embedding_ablation
      normalize: true
      trust_remote_code: false
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      dimensions:
      max_retries: 3
      query_prefix: "Instruct: Given a legal question, retrieve relevant Chinese law provisions.\nQuery: "
      document_prefix: ""
      embed_with_metadata: true
    chatlaw_text2vec:
      provider: sentence_transformers
      model_name: chestnutlzj/ChatLaw-Text2Vec
      role: legal_domain_model
      normalize: true
      trust_remote_code: false
      query_prefix: ""
      document_prefix: ""
    qwen3_embedding_4b:
      provider: siliconflow
      model_name: Qwen/Qwen3-Embedding-4B
      role: large_embedding_upper_bound
      normalize: true
      trust_remote_code: false
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      dimensions:
      max_retries: 3
      query_prefix: "Instruct: Given a legal question, retrieve relevant Chinese law provisions.\nQuery: "
      document_prefix: ""

retrieval:
  default: bm25
  top_k: 5
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_law_boost: 40.0
  bm25_article_boost: 80.0
  rrf_k: 60
  rrf_bm25_weight: 1.0
  rrf_dense_weight: 1.0
  # 已废止法律的得分乘数。1.0 表示不降权；查询明确提到该法律时不降权。
  deprecated_penalty: 0.5

adaptive:
  enabled: false
  use_llm: false
  max_queries: 3
  per_plan_top_k:
  normalizer_retries: 0

chat:
  memory_token_limit: 2000
  ollama_base_url: http://localhost:11434
  request_timeout: 180

judge:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  api_base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  request_timeout: 120
  temperature: 0.0

chunking:
  default_strategy: article
  candidates:
    - article
    - neighbor
    - long_split
    - fixed_chars
  neighbor_window: 3
  neighbor_stride:
  long_split_max_chars: 450
  long_split_overlap_chars: 60
  fixed_chars_size: 500
  fixed_chars_overlap: 80
