data:
  dataset_dir: Chinese-Laws/Chinese-Laws
  readme_path: Chinese-Laws/README.md
  # v1.0.0 冻结语料：Hugging Face Kuugo/Chinese_Law 固定 revision 的逐文件哈希。
  # 用 legal-rag fetch-corpus 下载、legal-rag verify-corpus 校验。
  corpus_manifest: configs/corpus/kuugo_chinese_law_a829f47d.manifest.json
  # 已被民法典(2021-01-01 施行)废止的法律。冻结语料不包含它们；旧的本地快照若仍含这些文件，检索时默认降权。
  deprecated_laws:
    - 中华人民共和国民法通则
    - 中华人民共和国合同法
    - 中华人民共和国继承法

artifacts:
  profile_dir: artifacts/profile
  index_dir: artifacts/indexes
  report_dir: reports

# 模型调用一律走 SiliconFlow API，本机不运行本地模型（docs/PROJECT_SCOPE.md D8）。
models:
  # 本地 Ollama 模型，只有显式 --model 或 --models all 时才会使用。
  ollama:
    - qwen2.5:7b
    - qwen3.5:4b
    - gemma4:e2b
  default: siliconflow:deepseek-ai/DeepSeek-V3

embedding:
  # bge-m3 在 SiliconFlow 上免费，单条最长 8192 token，冻结语料最长的条文也不会被截断。
  default: bge_m3
  cache_dir: artifacts/embeddings
  batch_size: 16
  device: auto
  models:
    bge_m3:
      provider: siliconflow
      model_name: BAAI/bge-m3
      role: chinese_general_baseline
      normalize: true
      trust_remote_code: false
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      dimensions:
      max_retries: 0
      request_timeout: 120
      query_prefix: ""
      document_prefix: ""
    qwen3_embedding_4b_meta:
      provider: siliconflow
      model_name: Qwen/Qwen3-Embedding-4B
      role: metadata_embedding_ablation
      normalize: true
      trust_remote_code: false
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      dimensions:
      max_retries: 0
      request_timeout: 120
      query_prefix: "Instruct: Given a legal question, retrieve relevant Chinese law provisions.\nQuery: "
      document_prefix: ""
      embed_with_metadata: true
    qwen3_embedding_4b:
      provider: siliconflow
      model_name: Qwen/Qwen3-Embedding-4B
      role: large_embedding_upper_bound
      normalize: true
      trust_remote_code: false
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      dimensions:
      max_retries: 0
      request_timeout: 120
      query_prefix: "Instruct: Given a legal question, retrieve relevant Chinese law provisions.\nQuery: "
      document_prefix: ""

retrieval:
  default: bm25
  top_k: 5
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_law_boost: 40.0
  bm25_article_boost: 80.0
  rrf_k: 60
  rrf_bm25_weight: 1.0
  rrf_dense_weight: 1.0
  # 已废止法律的得分乘数。1.0 表示不降权；查询明确提到该法律时不降权。
  deprecated_penalty: 0.5

reranking:
  # 重排默认关闭；启用时先扩大召回候选，再交给 SiliconFlow 上的 bge-reranker-v2-m3（免费）打分。
  default: none
  candidate_top_n: 20
  models:
    bge_v2_m3:
      provider: siliconflow
      model_name: BAAI/bge-reranker-v2-m3
      api_base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      request_timeout: 120
      include_metadata: true

adaptive:
  enabled: false
  use_llm: false
  max_queries: 3
  per_plan_top_k:
  normalizer_retries: 0

chat:
  memory_token_limit: 2000
  ollama_base_url: http://localhost:11434
  request_timeout: 180

judge:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  api_base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  request_timeout: 120
  temperature: 0.0

chunking:
  default_strategy: article
  candidates:
    - article
    - neighbor
    - long_split
    - fixed_chars
  neighbor_window: 3
  neighbor_stride:
  long_split_max_chars: 450
  long_split_overlap_chars: 60
  fixed_chars_size: 500
  fixed_chars_overlap: 80
